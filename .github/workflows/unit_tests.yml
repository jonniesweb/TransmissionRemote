name: Unit Tests and Android Quality

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Run lint
        if: ${{ always() }}
        run: ./gradlew lintDebug lintRelease --no-daemon --stacktrace

      - name: Build debug and release APKs
        if: ${{ always() }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload test, lint, and build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-quality-artifacts
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/test-results/
            app/build/outputs/apk/debug/
            app/build/outputs/apk/release/
